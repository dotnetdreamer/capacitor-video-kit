ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    androidxCoreVersion = project.hasProperty('androidxCoreVersion') ? rootProject.ext.androidxCoreVersion : '1.17.0'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.3.0'
    media3Version = project.hasProperty('media3Version') ? rootProject.ext.media3Version : '1.11.1'
    workManagerVersion = project.hasProperty('workManagerVersion') ? rootProject.ext.workManagerVersion : '2.11.2'
    okhttpVersion = project.hasProperty('okhttpVersion') ? rootProject.ext.okhttpVersion : '4.12.0'
    kotlinxCoroutinesVersion = project.hasProperty('kotlinxCoroutinesVersion') ? rootProject.ext.kotlinxCoroutinesVersion : '1.10.2'
    mlkitImageLabelingVersion = project.hasProperty('mlkitImageLabelingVersion') ? rootProject.ext.mlkitImageLabelingVersion : '17.0.9'
    mlkitPlayServicesImageLabelingVersion = project.hasProperty('mlkitPlayServicesImageLabelingVersion') ? rootProject.ext.mlkitPlayServicesImageLabelingVersion : '16.0.8'
}

buildscript {
    // Read from the host's variables.gradle so every Kotlin subproject in the build loads ONE
    // Kotlin Gradle plugin; two versions in a single build fail with "loaded multiple times".
    ext.kotlin_version = project.hasProperty('kotlin_version') ? rootProject.ext.kotlin_version : '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

/*
 * labelMedia's engine, ML Kit image labeling, comes in the form the host picks with
 * `videokitImageLabeling` in its variables.gradle (or `-PvideokitImageLabeling=...`):
 *
 *   true            the default: BUNDLED. The heaviest thing the kit adds to an app: a native library
 *                   of about 11 MB for each CPU a build carries (arm64-v8a; 7 MB for armeabi-v7a, 12 MB
 *                   each for x86 and x86_64) and a 3 MB model, which is 14 MB installed and about
 *                   6.4 MB downloaded on an arm64 phone from an app bundle, which Play splits by CPU.
 *                   Answers offline from the first call, and on a phone without Play services.
 *   'playServices'  the copy in Google Play services: about 200 KB in the app, and Play services
 *                   downloads the model, which the kit asks for when the plugin loads. Until it has
 *                   arrived, and on a phone without Play services, labelMedia refuses as `unsupported`.
 *   false           left out: labelMedia refuses as `unsupported`, as a browser does.
 *
 * The switch picks one of the three `SceneLabeler.kt` files.
 */
def labelingMode = (project.findProperty('videokitImageLabeling') ?: true).toString()
if (!(labelingMode in ['true', 'false', 'playServices'])) {
    throw new GradleException("videokitImageLabeling must be true, false or 'playServices', not '$labelingMode'")
}
def imageLabeling = labelingMode != 'false'
def playServicesLabeling = labelingMode == 'playServices'

android {
    // One module, two Capacitor plugin classes. The Kotlin packages stay separate
    // (...videocomposer and ...publisher) because they share nothing but a file path.
    namespace = "net.dotnetdreamer.videokit"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    sourceSets {
        main {
            java.srcDirs += !imageLabeling ? 'src/nolabeling/java'
                : playServicesLabeling ? 'src/labelingplay/java'
                : 'src/labeling/java'
        }
    }
    testOptions {
        // The pure classes (colour matrices, the render plan, the gain ramp, the parsers) touch
        // android.util.Log and android.net.Uri in places. With this flag the stubbed framework
        // returns null/0 instead of throwing, which is all those tests need - no Robolectric.
        unitTests.returnDefaultValues = true
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // NotificationCompat, ServiceCompat.startForeground(service, id, notification, type).
    implementation "androidx.core:core-ktx:$androidxCoreVersion"

    // --- VideoComposer: the render engine ---
    implementation "androidx.media3:media3-transformer:$media3Version"
    implementation "androidx.media3:media3-effect:$media3Version"
    implementation "androidx.media3:media3-common:$media3Version"
    implementation "androidx.media3:media3-muxer:$media3Version"
    // media3-exoplayer arrives transitively through media3-transformer; not listed on purpose.

    // --- BackgroundPublisher: the background transport ---
    // CoroutineWorker has lived in work-runtime since 2.9.0; work-runtime-ktx is an empty artifact.
    implementation "androidx.work:work-runtime:$workManagerVersion"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"

    // --- VideoComposer: labelMedia ---
    // ML Kit image labeling, BUNDLED by default: labelMedia answers offline from the first call, and
    // on a phone without Play services. What each form weighs, and how a host picks the Play services
    // one or leaves it out, is under `labelingMode` above. iOS needs nothing: Vision is part of the OS.
    if (playServicesLabeling) {
        implementation "com.google.android.gms:play-services-mlkit-image-labeling:$mlkitPlayServicesImageLabelingVersion"
    } else if (imageLabeling) {
        implementation "com.google.mlkit:image-labeling:$mlkitImageLabelingVersion"
    }

    testImplementation "junit:junit:$junitVersion"
    // The real org.json: the android.jar stub returns null from every getter once
    // returnDefaultValues is on, which would make the parser tests meaningless. Test dependencies
    // come before the mockable android.jar on the test classpath, so this implementation wins.
    testImplementation "org.json:json:20250107"
    testImplementation "com.squareup.okhttp3:mockwebserver:$okhttpVersion"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$kotlinxCoroutinesVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.work:work-testing:$workManagerVersion"
}
